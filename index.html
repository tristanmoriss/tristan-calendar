"<!doctype html><html><head><meta charset=utf-8><title>Tristan — Master Calendar</title>
<style>
 body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e8e8ea;margin:0;padding:20px}
 h1{font-size:20px;text-align:center;margin:6px 0}
 .nav{display:flex;justify-content:center;gap:14px;margin:8px 0 12px}
 button{background:#181b21;color:#e8e8ea;border:1px solid #2a2f38;border-radius:6px;padding:6px 16px;cursor:pointer}
 .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:1150px;margin:0 auto}
 .dow{color:#9aa0aa;font-size:12px;text-align:center;padding:4px 0}
 .day{background:#181b21;min-height:96px;border-radius:8px;padding:6px;font-size:12px;cursor:pointer;transition:outline .1s}
 .day:hover{outline:1px solid #d4af37}
 .day.dim{opacity:.3}.day.today{outline:2px solid #d4af37}
 .dnum{color:#9aa0aa;margin-bottom:4px}
 .ev{border-radius:5px;padding:2px 6px;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .deadline{background:#3a2020;border-left:3px solid #e06c5a}.academic{background:#1e2d3f;border-left:3px solid #6ca8e0}
 .travel{background:#203a2a;border-left:3px solid #6ce09a}.tax{background:#3a3416;border-left:3px solid #e0c05a}
 .manual,.recurring{background:#242830;border-left:3px solid #8a90a0}
 .ev.imp{font-weight:700}
 #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center}
 #modal.open{display:flex}
 .panel{background:#16181d;border:1px solid #2a2f38;border-radius:14px;padding:22px;width:min(480px,92vw)}
 .panel h2{margin:0 0 4px;font-size:18px;color:#d4af37}
 .panel .sub{color:#9aa0aa;font-size:12px;margin-bottom:12px}
 .panel .ag{display:flex;gap:10px;align-items:baseline;background:#1e2127;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:14px}
 .panel .ag .t{color:#9aa0aa;font-size:12px;min-width:40px}
 .del{margin-left:auto;color:#e06c5a;font-weight:700;cursor:pointer}
 .panel form{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
 input,select{background:#22252c;color:#e8e8ea;border:1px solid #2a2f38;border-radius:6px;padding:8px}
 input[type=submit]{background:#d4af37;color:#111;border:0;font-weight:600;cursor:pointer}
 .back{margin-top:14px;width:100%;background:#22252c}
</style></head><body>
<h1 id="mLabel" style="cursor:pointer" onclick="closeDay()"></h1>
<div class="nav"><button onclick="mv(-1)">‹ Prev</button><button onclick="view=new Date();closeDay();refresh()">Today</button><button onclick="mv(1)">Next ›</button></div>
<div class="grid" id="grid"></div>
<div id="modal"><div class="panel">
 <h2 id="dLabel"></h2><div class="sub" id="dSub"></div><div class="hint" style="display:none;color:#d4af37;font-size:12px;margin:6px 0">Read-only on phone — to add or remove, text the calendar bot on Telegram.</div>
 <div id="dayEvents"></div>
 <form id="df"><input type=hidden name=date id="dfDate"><input type=time name=time><input name=title placeholder="Add event…" required style="flex:1;min-width:160px">
 <select name=source><option>manual</option><option>school</option><option>churn</option><option>money</option><option>travel</option><option>dues</option><option>pawn</option></select>
 <select name=type><option>manual</option><option>deadline</option><option>academic</option><option>travel</option><option>tax</option></select>
 <input type=submit value=Add></form>
 <button class="back" onclick="closeDay()">← Back to month</button>
</div></div>
<script>
let view=new Date(),ALL=[],openDate=null;const isLocal=['127.0.0.1','localhost'].includes(location.hostname);
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const cls=e=>['deadline','academic','travel','tax'].includes(e.type)?e.type:(e.source&&e.source!=='manual'?e.source:'manual');
const imp=e=>e.type==='deadline'||e.title.startsWith('\u{1F534}');
async function refresh(){ALL=await(await fetch('/events')).json();ALL.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
 const y=view.getFullYear(),m=view.getMonth();
 document.getElementById('mLabel').textContent=MON[m]+' '+y;
 const start=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 const today=new Date().toISOString().slice(0,10);
 let g=DOW.map(d=>'<div class=dow>'+d+'</div>').join('');
 for(let i=0;i<start;i++)g+='<div class="day dim"></div>';
 for(let d=1;d<=days;d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const de=ALL.filter(e=>e.date===ds).slice(0,3).map(e=>'<div class="ev '+cls(e)+(imp(e)?' imp':'')+'">'+(imp(e)?'\u{1F534} ':'')+(e.time?e.time+' ':'')+e.title.replace(/</g,'&lt;')+'</div>').join('');
  const more=ALL.filter(e=>e.date===ds).length>3?'<div class=dnum style="color:#666">+'+(ALL.filter(e=>e.date===ds).length-3)+' more</div>':'';
  g+='<div class="day'+(ds===today?' today':'')+'" onclick="openDay(\''+ds+'\')"><div class=dnum>'+d+'</div>'+de+more+'</div>';}
 document.getElementById('grid').innerHTML=g;
 if(openDate)renderDay();}
function mv(n){view.setMonth(view.getMonth()+n);openDate=null;document.getElementById('modal').classList.remove('open');refresh();}
function openDay(ds){openDate=ds;renderDay();document.getElementById('modal').classList.add('open');document.querySelector('.panel form').style.display=isLocal?'flex':'none';document.querySelector('.hint').style.display=isLocal?'none':'block';document.querySelectorAll('.del').forEach(x=>x.style.display=isLocal?'inline':'none');}
function closeDay(){openDate=null;document.getElementById('modal').classList.remove('open');}
function renderDay(){if(!openDate)return;
 document.getElementById('dLabel').textContent=new Date(openDate+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
 const evs=ALL.filter(e=>e.date===openDate);
 document.getElementById('dSub').textContent=evs.length?evs.length+' event'+(evs.length>1?'s':''):'No events yet';
 document.getElementById('dfDate').value=openDate;
 document.getElementById('dayEvents').innerHTML=evs.map(e=>'<div class=ag><span class=t>'+(e.time||'')+'</span><span>'+(imp(e)?'\u{1F534} ':'')+e.title+' <span style="color:#666">· '+e.source+'</span></span><span class=del onclick="delEv(\''+e.date+'\',\''+e.title.replace(/'/g,"\\'")+'\')">\u2715</span></div>').join('')
  ||'<div style="color:#666;font-size:13px">Nothing on this day.</div>';}
document.getElementById('df').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.target);
 await fetch('/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(fd))});
 ev.target.querySelector('[name=title]').value='';refresh();};
async function delEv(d,t){await fetch('/events',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:d,title:t})});refresh();}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeDay();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDay();
 if(e.key==='ArrowLeft'&&e.target.tagName!=='INPUT'){view.setMonth(view.getMonth()-1);refresh();}
 if(e.key==='ArrowRight'&&e.target.tagName!=='INPUT'){view.setMonth(view.getMonth()+1);refresh();}});
refresh();
</script></body></html>
