<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#0f1115">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Tristan — Master Calendar</title><style>
:root{--bg:#0f1115;--bg2:#16181d;--line:#262b34;--muted:#8a91a0;--text:#e8e9ec;--gold:#d4af37;
--red:#e06c5a;--blue:#6ca8e0;--green:#5fd197;--teal:#4fc3c3;--amber:#e0c05a;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:0 0 env(safe-area-inset-bottom)}
#top{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.94);backdrop-filter:blur(10px);
padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:8px}
.ttl{flex:1;min-width:0}
.big{font-size:20px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.navb{display:flex;gap:6px}
.nbtn{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#1a1d24;
color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0 8px}
.nbtn:active{background:#232730}
.nbtn.today{width:auto;padding:0 14px;font-size:12.5px;font-weight:700;color:var(--gold)}
.row2{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.row2::-webkit-scrollbar{display:none}
.vbtn{background:#1a1d24;border:1px solid var(--line);color:var(--text);border-radius:8px;
padding:7px 13px;font-size:12.5px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.vbtn.on{background:var(--gold);color:#151515;border-color:var(--gold);font-weight:700}
main{padding:12px 12px calc(26px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto}
#view.dayfill{min-height:calc(100vh - 210px);display:flex;flex-direction:column}
#view.dayfill .dcard{flex:1;display:flex;flex-direction:column}
#view.dayfill .free{flex:1;display:flex;align-items:center;justify-content:center;font-size:16px}
.card{cursor:pointer;background:#14161b;border:1px solid #22262e;border-radius:12px}
.dcard{padding:13px 10px 4px;border:none;border-radius:0;background:transparent;border-bottom:1px solid #1b1f27}
.dcard .dhead{color:var(--text)}
.dcard.sel .dhead{color:var(--gold)}
.dhead{display:flex;align-items:baseline;gap:8px;padding-bottom:4px}
.dhead .dow{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.dhead .dn{font-size:19px;font-weight:800}
.badge{background:var(--gold);color:#151515;font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px}
.row{display:flex;gap:12px;align-items:center;padding:15px 12px 15px 0;border-bottom:1px solid #191d24;cursor:pointer;min-height:64px}
.row:active{background:#1c2028}
.sq{width:4px;align-self:stretch;border-radius:3px;flex:0 0 4px;height:38px}
.b{flex:1;min-width:0}
.tm{font-size:12px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.ti{font-size:16px;line-height:1.45;color:#e8e9ec;word-break:break-word;margin-top:2px}
.srcn{font-size:10.5px;color:var(--muted);margin-top:2px}
.free{color:var(--muted);font-size:13.5px;font-style:italic;padding:10px 0}
.x{flex:0 0 auto;background:#241318;color:var(--red);font-size:15px;width:36px;height:36px;border-radius:9px;cursor:pointer;font-weight:700;border:1px solid #3a1e1e}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#22262e;border:1px solid #2a2f38;border-radius:12px;overflow:hidden}
.dowh{background:#111319;padding:6px 2px;font-size:10px;font-weight:800;color:var(--muted);text-align:center}
.mcell{background:#14161b;min-height:88px;padding:5px 6px;cursor:pointer;position:relative;overflow:hidden}
.mcell:active{background:#1e222a}
.mcell.out{background:#0d0f13}
.dnum{font-weight:800;font-size:13px;color:#c9cdd6}
.mcell.today .dnum{color:#151515;background:var(--gold);border-radius:6px;padding:0 6px;display:inline-block}
.te{font-size:9.5px;line-height:1.3;margin-top:4px;border-left:2px solid;padding:0 0 0 3px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#dfe1e6}
.dots{display:flex;gap:3px;margin-top:4px}
.dot{width:6px;height:6px;border-radius:50%}
.moren{font-size:8.5px;color:var(--muted);margin-top:2px}
.tdy{background:var(--gold);color:#151515;font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:20px}
.panel{background:#16181d}
#top{padding-top:calc(10px + env(safe-area-inset-top))}
@media(min-width:761px){
.dcard{background:#14161b;border:1px solid #22262e;border-radius:12px;margin:0 0 10px;padding:14px}
.mcell{min-height:96px}
}
</style></head><body>
<header id="top">
 <div class=row1>
  <button class=nbtn data-nav=prev>&#8249;</button>
  <div class=ttl><div class=big id=tBig></div><div class=sub id=tSub></div></div>
  <button class="nbtn today" data-nav=today>TODAY</button>
  <button class=nbtn data-nav=next>&#8250;</button>
 </div>
 <div class=row2 id=filters></div>
</header>
<main id=view></main>
<div id=modal style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9;align-items:flex-end;justify-content:center">
 <div class="panel" style="border-radius:18px 18px 0 0;width:min(560px,100%);padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto">
  <div style="width:40px;height:4px;background:#3a3f4a;border-radius:3px;margin:0 auto 12px"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <div style="min-width:0"><div style="font-size:19px;font-weight:800" id=mBig></div><div style="font-size:11.5px;color:var(--muted)" id=mSub></div></div>
    <button class=x onclick="closeM()">&#10005;</button>
  </div>
  <button id=patBtn style="display:none;width:100%;margin:12px 0 4px;background:transparent;border:1px dashed var(--gold);color:var(--gold);border-radius:10px;padding:12px;font-size:13px;cursor:pointer" onclick="askPat()">Enable phone editing — paste GitHub token</button>
  <div id=mList></div>
  <form id=df style="display:none;gap:6px;margin-top:12px;flex-wrap:wrap">
    <input type=hidden name=date id=dfDate><input name=time placeholder HH:MM style="width:82px" onfocus="this.type='time'">
    <input name=title placeholder="Add event..." required style="flex:1;min-width:120px">
    <select name=source><option>manual</option><option>churn</option><option>churn-kat</option><option>school</option><option>money</option><option>travel</option><option>dues</option></select>
    <input type=submit value="＋">
  </form>
 </div>
</div>
<script>
var BUILD='v8 · Nov 05 11:17PM CST';
var OWNER='tristanmoriss',REPO='tristan-calendar';
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var M3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
var LOCAL=['127.0.0.1','localhost'].indexOf(location.hostname)>=0;
var URL_=LOCAL?'/events':'events.json';
var PK='cal_pat_'+REPO;
var view=new Date(),MODE=(innerWidth<761)?'day':'month',FILTER='all',ALL=[],openDate=null;
var FILTERS=[['all','All'],['mine','Mine'],['kat','Kat\'s'],['general','General']];
function pat(){return localStorage.getItem(PK)||''}
function z(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function todayStr(){var d=new Date(Date.now()-new Date().getTimezoneOffset()*60000);return ds(d)}
function cls(e){return ['deadline','academic','travel','tax'].indexOf(e.type)>=0?e.type:(e.source||'manual')}
function col(c){var m={deadline:'#e06c5a',academic:'#6ca8e0',travel:'#5fd197',tax:'#e0c05a',churn:'#d4af37'};return m[c]||(c==='churn-kat'?'#4fc3c3':'#7a8090')}
function imp(e){return e.type==='deadline'||String(e.title||'').indexOf('\uD83D\uDD34')===0}
function pass(e){if(FILTER==='all')return true;var s=e.source||'';if(FILTER==='mine')return s==='churn';if(FILTER==='kat')return s==='churn-kat';return s.indexOf('churn')<0}
function editOK(){return LOCAL||!!pat()}
async function ghGet(){var r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/events.json',{headers:pat()?{Authorization:'Bearer '+pat(),Accept:'application/vnd.github+json'}:{Accept:'application/vnd.github+json'}});return r.ok?r.json():null}
async function ghSave(list){
 if(!pat()){askPat();return}
 var cur=await ghGet();
 var body={message:'phone edit '+new Date().toISOString(),
  content:btoa(unescape(encodeURIComponent(JSON.stringify({events:list},null,1)))),branch:'main'};
 if(cur){body.sha=cur.sha}
 var r=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/events.json',{method:'PUT',headers:{Authorization:'Bearer '+pat(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){alert('Save failed ('+r.status+')')}
 return r.ok;
}
async function refresh(){
 try{var r=await fetch(URL_+(URL_.indexOf('?')>=0?'&':'?')+'t='+Date.now(),{cache:'no-store'});var d=await r.json();ALL=Array.isArray(d)?d:(d.events||[])}catch(e){ALL=[]}
 ALL.sort(function(a,b){return (a.date+(a.time||'')).localeCompare(b.date+(b.time||''))});
 render();
}
function render(){
 var f=document.getElementById('filters');f.innerHTML='';
 FILTERS.forEach(function(x){var b=document.createElement('button');b.className='vbtn'+(FILTER===x[0]?' on':'');b.textContent=x[1];b.onclick=function(){FILTER=x[0];render()};f.appendChild(b)});
 ['day','week','month'].forEach(function(m){var b=document.createElement('button');b.className='vbtn'+(MODE===m?' on':'');b.textContent=m.toUpperCase();b.onclick=function(){MODE=m;render()};f.appendChild(b)});
 if(MODE==='month'){tBig.textContent=MONL[view.getMonth()]+' '+view.getFullYear();tSub.textContent=BUILD}
 else{tBig.textContent=(MODE==='day')?(DOW[view.getDay()]+', '+M3[view.getMonth()]+' '+view.getDate()):('Week of '+M3[view.getMonth()]+' '+view.getDate());
  tSub.textContent=MONL[view.getMonth()]+' '+view.getFullYear()+' · '+BUILD}
 if(MODE==='month'){renderMonth()}else{renderList()}
 if(openDate){showModal(openDate)}
}
function rowHTML(e,inModal){
 var t=e.time||'';
 return '<div class=row><div class=sq style="background:'+col(cls(e))+'"></div><div class=b><div class=tm>'+t+'</div><div class=ti>'+String(e.title||'').replace(/</g,'&lt;')+'</div><div class=srcn>'+(e.source||'')+'</div></div><button class=x onclick="delEv(\''+e.date+'\',\''+String(e.title||'').replace(/\x27/g,"\\x27")+'\')">&#10005;</button></div>';
}
function renderList(){
 var today=todayStr(),base=new Date(view.getFullYear(),view.getMonth(),view.getDate());
 if(MODE==='week')base.setDate(base.getDate()-base.getDay());
 var n=(MODE==='week')?7:1,html='';
 for(var i=0;i<n;i++){
  var d=new Date(base);d.setDate(base.getDate()+i);var key=ds(d);
  var evs=ALL.filter(function(e){return e.date===key&&pass(e)});
  html+='<div class="dcard card'+(key===today?' sel':'')+'" onclick="showModal(\''+key+'\')">';
  html+='<div class=dhead><span class=dow>'+DOW[d.getDay()]+'</span><span class=dn>'+(M3[d.getMonth()]+' '+d.getDate())+'</span>'+(key===today?'<span class=badge>TODAY</span>':'')+'</div>';
  if(evs.length){evs.forEach(function(e){html+=rowHTML(e)})}
  else{html+='<div class=free style="padding:8px 0 6px 4px">Nothing scheduled</div>'}
  html+='</div>';
 }
 document.getElementById('view').className=(MODE==='day')?'dayfill':''; document.getElementById('view').innerHTML=html;
}
function renderMonth(){
 var y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 var today=todayStr(),html='<div class=mgrid>';
 DOW.forEach(function(x){html+='<div class=dowh>'+x.toUpperCase()+'</div>'});
 for(var i=0;i<first;i++)html+='<div class="mcell out"></div>';
 for(var d=1;d<=days;d++){
  var dd=new Date(y,m,d),key=ds(dd);
  var evs=ALL.filter(function(e){return e.date===key&&pass(e)});
  var inner=(narrow()&&evs.length)?('<div class=te style="border-color:'+col(cls(evs[0]))+'">'+String(evs[0].title||'').replace(/</g,'&lt;')+'</div>'+
   (evs.length>1?'<div class=dots>'+evs.slice(1,5).map(function(e){return '<span class=dot style="background:'+col(cls(e))+'"></span>'}).join('')+(evs.length>5?'<span class=moren>+'+(evs.length-5)+'</span>':'')+'</div>':''))
   :evs.slice(0,4).map(function(e){return '<div class=te style="border-color:'+col(cls(e))+'">'+String(e.title||'').replace(/</g,'&lt;')+'</div>'}).join('');
  html+='<div class="mcell'+(key===today?' today':'')+'" onclick="showModal(\''+key+'\')"><div class=dnum>'+(key===today?'<span class=tdy>'+d+'</span>':d)+'</div>'+inner+'</div>';
 }
 document.getElementById('view').innerHTML=html+'</div>';
}
function narrow(){return innerWidth<640}
function nav(n){if(MODE==='month')view.setMonth(view.getMonth()+n);else if(MODE==='week')view.setDate(view.getDate()+7*n);else view.setDate(view.getDate()+n);openDate=null;refresh()}
document.querySelectorAll('[data-nav]').forEach(function(b){b.addEventListener('click',function(){var a=b.dataset.nav;if(a==='today'){view=new Date()}else{nav(a==='prev'?-1:1)}})});
function showModal(k){
 openDate=k;document.getElementById('modal').style.display='flex';
 document.getElementById('patBtn').style.display=(!LOCAL&&!pat())?'block':'none';
 document.getElementById('df').style.display=editOK()?'flex':'none';
 var d=new Date(k+'T12:00');
 document.getElementById('mBig').textContent=DOW[d.getDay()]+', '+MONL[d.getMonth()]+' '+d.getDate();
 var evs=ALL.filter(function(e){return e.date===k&&pass(e)});
 document.getElementById('mSub').textContent=evs.length+(evs.length===1?' event':' events');
 document.getElementById('dfDate').value=k;
 document.getElementById('mList').innerHTML=evs.length?evs.map(function(e){return rowHTML(e)}).join(''):'<div class=free style="padding:14px 0">Nothing scheduled</div>';
}
function closeM(){openDate=null;document.getElementById('modal').style.display='none'}
function askPat(){var t=prompt('Paste a GitHub fine-grained token with Contents read/write on '+REPO+'.\nStored only in this browser.');if(t){localStorage.setItem(PK,t.trim());render()}}
var mE=document.getElementById('modal');
mE.addEventListener('click',function(e){if(e.target===mE){closeM()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeM()}});
document.getElementById('df').addEventListener('submit',async function(ev){
 ev.preventDefault();var o=Object.fromEntries(new FormData(ev.target));
 if(LOCAL){await fetch(URL_,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})}
 else{var list=ALL.slice();o.date=String(o.date).slice(0,10);list.push(o);
  list.sort(function(a,b){return (a.date+(a.time||'')).localeCompare(b.date+(b.time||''))});await ghSave(list)}
 ev.target.querySelector('[name=title]').value='';refresh();
});
async function delEv(d,t){
 if(!LOCAL&&!pat()){askPat();if(!pat())return}
 var list=ALL.filter(function(e){return !(e.date===d&&e.title===t)});
 if(LOCAL){await fetch(URL_,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:d,title:t})});refresh();return}
 var ok=await ghSave(list);if(ok){refresh()}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden){refresh()}});
setInterval(function(){if(document.hidden){refresh()}},300000);
refresh();
</script></body></html>
